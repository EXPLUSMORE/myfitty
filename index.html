<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6f4e">
<meta name="robots" content="noindex, nofollow">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>myfitty</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#faf9f7;--card:#fff;--ink:#1c1b19;--muted:#6b6862;--line:#e5e2dc;
  --accent:#2f6f4e;--accent2:#3a5f8a;--run:#8a5a2f;--warn:#a33a2a;--done:#2f6f4e;
  --shadow:0 1px 3px rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#141311;--card:#1f1e1b;--ink:#f2f0ec;--muted:#a39f97;--line:#33312d;
    --accent:#6fbf90;--accent2:#8ab0dd;--run:#d0a071;--warn:#e08a78;--done:#6fbf90;
    --shadow:0 1px 3px rgba(0,0,0,.3);}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:calc(78px + env(safe-area-inset-bottom));}
.wrap{max-width:640px;margin:0 auto;padding:16px 14px 20px}
h1{font-size:1.35rem;margin:0 0 2px}
h2{font-size:1.05rem;margin:22px 0 8px}
.muted{color:var(--muted);font-size:.87rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:14px;margin:12px 0;box-shadow:var(--shadow)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
.btn{background:var(--accent);color:#fff;border-radius:10px;padding:12px 16px;
  font-weight:600;font-size:.95rem;width:100%;text-align:center;display:block}
.btn.sec{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.warn{background:var(--warn)}
.btn.small{padding:8px 12px;font-size:.85rem;width:auto;display:inline-block}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1}
/* nav */
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);
  border-top:1px solid var(--line);display:flex;z-index:50;
  padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:11px 4px 12px;font-size:.68rem;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--accent)}
nav .ic{font-size:1.25rem;line-height:1}
/* session tiles */
.tile{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:12px;
  border:1px solid var(--line);background:var(--card);margin:8px 0;box-shadow:var(--shadow)}
.tile .badge{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;font-weight:700;font-size:.9rem;color:#fff;background:var(--accent);flex:none}
.tile.run .badge{background:var(--run)}
.tile.rest .badge{background:var(--muted)}
.tile.today{border-color:var(--accent);border-width:2px}
.tile .t1{font-weight:600;font-size:.95rem}
.tile .t2{font-size:.8rem;color:var(--muted)}
.tile .chk{margin-left:auto;font-size:1.1rem;color:var(--done)}
/* exercise */
.ex{border:1px solid var(--line);border-radius:12px;margin:10px 0;background:var(--card);
  overflow:hidden;box-shadow:var(--shadow)}
.ex.complete{border-color:var(--done)}
.ex .hd{padding:12px 13px;display:flex;gap:10px;align-items:flex-start}
.ex .nm{font-weight:600;font-size:.95rem;flex:1}
.ex .meta{font-size:.78rem;color:var(--muted);margin-top:2px}
.ex .prog{font-size:.75rem;color:var(--muted);white-space:nowrap;padding-top:2px}
.ex .body{padding:0 13px 12px}
.setrow{display:flex;align-items:center;gap:7px;padding:6px 0;border-top:1px solid var(--line)}
.setno{width:20px;font-size:.8rem;color:var(--muted);flex:none}
.setrow input{width:100%;padding:9px 8px;border:1px solid var(--line);border-radius:8px;
  background:var(--bg);color:var(--ink);font-size:.92rem;text-align:center;
  -moz-appearance:textfield}
.setrow input::-webkit-outer-spin-button,.setrow input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.setrow .fld{flex:1;position:relative}
.setrow .unit{position:absolute;right:7px;top:50%;transform:translateY(-50%);
  font-size:.68rem;color:var(--muted);pointer-events:none}
.tick{width:42px;height:38px;flex:none;border-radius:9px;border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:1rem;color:var(--muted)}
.tick.on{background:var(--done);border-color:var(--done);color:#fff}
.hint{font-size:.72rem;color:var(--muted);padding:2px 0 6px}
.note{font-size:.78rem;color:var(--muted);margin-top:4px;line-height:1.4}
a.vid{font-size:.75rem;color:var(--accent2);text-decoration:none;border:1px solid var(--line);
  border-radius:6px;padding:2px 7px;display:inline-block;margin-top:5px}
/* timer */
.timerbar{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom));
  background:var(--accent);color:#fff;padding:10px 14px;display:none;
  align-items:center;gap:12px;z-index:49;box-shadow:0 -2px 8px rgba(0,0,0,.12)}
.timerbar.on{display:flex}
.timerbar .tm{font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums}
.timerbar button{background:rgba(255,255,255,.2);border-radius:8px;padding:6px 11px;
  font-size:.8rem;font-weight:600;color:#fff}
/* misc */
.pill{display:inline-block;font-size:.7rem;padding:3px 9px;border-radius:99px;
  background:var(--line);color:var(--muted);font-weight:600}
.pill.g{background:var(--accent);color:#fff}
.pill.r{background:var(--run);color:#fff}
.slider{width:100%;margin:8px 0 2px}
input[type=range]{accent-color:var(--warn)}
.big{font-size:1.9rem;font-weight:700;line-height:1.1}
.stat{flex:1;min-width:88px;text-align:center;padding:10px 6px;border:1px solid var(--line);
  border-radius:10px;background:var(--card)}
.stat .v{font-size:1.3rem;font-weight:700}
.stat .l{font-size:.7rem;color:var(--muted);margin-top:1px}
textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;
  background:var(--bg);color:var(--ink);font:inherit;font-size:.9rem;resize:vertical;min-height:60px}
select{padding:9px;border:1px solid var(--line);border-radius:9px;background:var(--bg);
  color:var(--ink);font:inherit;font-size:.9rem}
input.ed{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;
  background:var(--bg);color:var(--ink);font:inherit;font-size:.9rem}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;
  background:var(--bg);overflow:hidden;height:38px}
.stepper button{flex:none;width:38px;height:100%;font-size:1.15rem;font-weight:700;
  color:var(--accent);background:transparent;line-height:1}
.stepper button:disabled{opacity:.3}
.stepper span{flex:1;text-align:center;font-size:.95rem;font-weight:700;
  font-variant-numeric:tabular-nums}
/* Muskelgruppen-Symbol */
.bodyicon{width:100%;height:100%;display:block}
.bodyicon *{fill:var(--line)}
.bodyicon .hi{fill:var(--accent)}
.icobox{width:46px;height:46px;flex:none;border-radius:10px;background:var(--bg);
  border:1px solid var(--line);padding:4px}
.icobox.sm{width:34px;height:34px;padding:3px}
.icobox.lg{width:64px;height:64px;padding:6px}
.mgchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.mgchip{font-size:.78rem;padding:6px 11px;border-radius:99px;border:1px solid var(--line);
  background:var(--bg);color:var(--muted);cursor:pointer;user-select:none}
.mgchip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.hbar{display:flex;align-items:flex-end;gap:3px;height:60px;margin:10px 0}
.hbar div{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.hist{padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.hist:last-child{border-bottom:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:130px;background:var(--ink);
  color:var(--bg);padding:10px 18px;border-radius:99px;font-size:.85rem;z-index:100;
  opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:.95}
.brand{font-size:.72rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
  color:var(--accent);margin-bottom:2px}
#upd{position:fixed;left:12px;right:12px;bottom:calc(74px + env(safe-area-inset-bottom));
  background:var(--accent);color:#fff;border-radius:14px;padding:12px 14px;z-index:60;
  display:none;align-items:center;gap:12px;box-shadow:0 6px 22px rgba(0,0,0,.22)}
#upd.on{display:flex;animation:pop .3s cubic-bezier(.2,1.2,.4,1)}
#upd .t{flex:1;font-size:.87rem;line-height:1.35}
#upd button{background:#fff;color:var(--accent);border-radius:9px;padding:8px 13px;
  font-size:.85rem;font-weight:700}
#upd .x{background:transparent;color:#fff;font-weight:400;opacity:.8;padding:8px 4px}
/* dashboard */
.ring{width:96px;height:96px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .ctr .n{font-size:1.5rem;font-weight:700;line-height:1}
.ring .ctr .u{font-size:.62rem;color:var(--muted);margin-top:1px}
.chart{display:flex;align-items:flex-end;gap:4px;height:76px;margin:12px 0 4px}
.chart .b{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:3px;position:relative;opacity:.9}
.chart .b.run{background:var(--run)}
.chart .b.pain{background:var(--accent)}
.chart .b.hi{background:var(--warn)}
.xax{display:flex;gap:4px;font-size:.62rem;color:var(--muted)}
.xax span{flex:1;text-align:center;overflow:hidden;white-space:nowrap}
.hm{display:grid;grid-template-columns:22px repeat(7,1fr);gap:3px;font-size:.6rem}
.hm .c{aspect-ratio:1;border-radius:4px;background:var(--line)}
.hm .c.d{background:var(--accent)}
.hm .c.r{background:var(--run)}
.hm .c.m{background:var(--line);box-shadow:inset 0 0 0 1.5px var(--accent2)}
.hm .c.f{opacity:.35}
.hm .lbl{color:var(--muted);display:flex;align-items:center;font-size:.6rem}
.hm .hd{text-align:center;color:var(--muted);padding-bottom:2px}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.kpi .stat{min-width:0}
.trow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.86rem}
.trow:last-child{border-bottom:none}
.trow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .vl{font-weight:700;font-variant-numeric:tabular-nums}
.verdict{font-size:.85rem;line-height:1.45;padding:11px 12px;border-radius:10px;
  background:var(--bg);border:1px solid var(--line);margin-top:10px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.7rem;color:var(--muted);margin-top:8px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:4px;vertical-align:-1px}
/* gains gadget */
#gains{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:200;display:none;
  align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(3px)}
#gains.on{display:flex;animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.gbox{background:var(--card);border-radius:20px;padding:22px 18px 16px;max-width:400px;width:100%;
  text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.35);animation:pop .35s cubic-bezier(.2,1.2,.4,1);
  max-height:88vh;overflow-y:auto}
@keyframes pop{from{transform:scale(.85) translateY(14px);opacity:0}to{transform:none;opacity:1}}
.gbox .ttl{font-size:.76rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.gbox .kg{font-size:2.5rem;font-weight:800;line-height:1.05;margin:4px 0 1px;
  background:linear-gradient(95deg,var(--accent),var(--accent2));-webkit-background-clip:text;
  background-clip:text;-webkit-text-fill-color:transparent}
.gbox .eq{font-size:.8rem;color:var(--muted);margin-bottom:12px}
.gitem{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:12px;
  background:var(--bg);margin:7px 0;text-align:left;
  animation:slide .4s backwards cubic-bezier(.2,1,.3,1)}
@keyframes slide{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.gitem .em{font-size:1.55rem;line-height:1;flex:none;width:30px;text-align:center}
.gitem .ct{font-size:1.15rem;font-weight:800;min-width:34px;font-variant-numeric:tabular-nums}
.gitem .nn{font-size:.9rem;flex:1}
.gitem .kgs{font-size:.68rem;color:var(--muted)}
.gitem.pig{background:linear-gradient(100deg,rgba(200,140,60,.14),transparent);
  box-shadow:inset 0 0 0 1.5px rgba(200,140,60,.35)}
.gquip{font-size:.87rem;line-height:1.45;margin:13px 2px 4px;color:var(--ink)}
.pigrow{font-size:.95rem;letter-spacing:1px;line-height:1.5;margin-top:3px;word-break:break-word}
details{border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin:9px 0;background:var(--card)}
summary{font-weight:600;font-size:.92rem;cursor:pointer}
details ul{padding-left:18px;font-size:.87rem}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<div class="timerbar" id="timerbar">
  <span class="tm" id="tmDisp">1:30</span>
  <span style="font-size:.8rem;opacity:.9">Satzpause</span>
  <div style="margin-left:auto;display:flex;gap:7px">
    <button onclick="addTime(30)">+30s</button>
    <button onclick="stopTimer()">Stop</button>
  </div>
</div>

<nav>
  <button id="nav-home" onclick="go('home')"><span class="ic">🏠</span>Heute</button>
  <button id="nav-week" onclick="go('week')"><span class="ic">📅</span>Woche</button>
  <button id="nav-stats" onclick="go('stats')"><span class="ic">📊</span>Dashboard</button>
  <button id="nav-mob" onclick="go('mob')"><span class="ic">🧘</span>Mobility</button>
  <button id="nav-more" onclick="go('more')"><span class="ic">⚙️</span>Mehr</button>
</nav>

<div class="toast" id="toast"></div>
<div id="gains" onclick="closeGains()"></div>
<div id="upd"><span class="t">Neue Version verfügbar</span>
  <button onclick="applyUpdate()">Laden</button>
  <button class="x" onclick="document.getElementById('upd').className=''">Später</button></div>

<script>
/* ============ MUSKELGRUPPEN-SYMBOL ============ */
const MUSCLE = {
  schulter:'Schulter', brust:'Brust', ruecken:'Rücken', arme:'Arme',
  rumpf:'Rumpf', gesaess:'Gesäß', beine:'Beine', waden:'Waden'
};
const MG_ORDER = ['schulter','brust','ruecken','arme','rumpf','gesaess','beine','waden'];

/* Körper-Silhouette; markierte Zonen werden eingefärbt */
function bodyIcon(zones){
  const z = new Set(zones||[]);
  const c = k => z.has(k) ? 'hi' : '';
  return `<svg viewBox="0 0 100 100" class="bodyicon" aria-hidden="true">
    <circle cx="50" cy="13" r="7.5"/>
    <rect x="46.5" y="19" width="7" height="5"/>
    <polygon class="${c('ruecken')}" points="39,26 29,46 40,42"/>
    <polygon class="${c('ruecken')}" points="61,26 71,46 60,42"/>
    <ellipse class="${c('schulter')}" cx="34.5" cy="29" rx="7.5" ry="6.5"/>
    <ellipse class="${c('schulter')}" cx="65.5" cy="29" rx="7.5" ry="6.5"/>
    <rect class="${c('brust')}" x="39" y="24" width="22" height="14" rx="5"/>
    <rect class="${c('arme')}" x="27.5" y="33" width="7" height="17" rx="3.5"/>
    <rect class="${c('arme')}" x="65.5" y="33" width="7" height="17" rx="3.5"/>
    <rect class="${c('arme')}" x="26.5" y="51" width="6.5" height="15" rx="3"/>
    <rect class="${c('arme')}" x="67" y="51" width="6.5" height="15" rx="3"/>
    <rect class="${c('rumpf')}" x="41.5" y="39" width="17" height="17" rx="4"/>
    <rect class="${c('gesaess')}" x="39.5" y="56.5" width="21" height="9" rx="4"/>
    <rect class="${c('beine')}" x="40.5" y="65" width="8.5" height="16" rx="4"/>
    <rect class="${c('beine')}" x="51" y="65" width="8.5" height="16" rx="4"/>
    <rect class="${c('waden')}" x="41.5" y="82" width="7.5" height="13" rx="3.5"/>
    <rect class="${c('waden')}" x="51" y="82" width="7.5" height="13" rx="3.5"/>
  </svg>`;
}

/* Standard-Muskelgruppen je Übung */
const MG_DEF = {
  a1:['beine','gesaess'], a2:['beine','gesaess','ruecken'], a3:['ruecken','arme'],
  a4:['ruecken','arme'], a5:['beine'], a6:['waden'], a7:['rumpf'],
  b1:['brust','arme'], b2:['beine','gesaess'], b3:['ruecken','arme'], b4:['beine'],
  b5:['arme'], b6:['arme'], b7:['rumpf'],
  c1:['beine','gesaess'], c2:['ruecken','arme'], c3:['brust','arme'],
  c4:['gesaess','beine'], c5:['rumpf','beine'], c6:['ruecken','gesaess'], c7:['rumpf'],
};
const SH_MG = [['schulter'],['schulter','ruecken'],['schulter','brust'],['schulter','ruecken'],['ruecken','schulter']];

function mgOf(e){ return (e && e.mg) ? e.mg : (MG_DEF[e&&e.id] || []); }
function mgLabel(list){ return (list||[]).map(k=>MUSCLE[k]).filter(Boolean).join(', '); }

/* ============ PLAN ============ */
const V = q => 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q);

const DEFAULT_PLAN = {
  A:{name:'Einheit A – Beine & Zug', type:'gym', short:'A', sub:'Härtester Beintag',
    ex:[
      {id:'a1',n:'Beinpresse, tiefer ROM', s:4, r:'8–12', rpe:'8', note:'Tief, solange das Becken am Polster bleibt.', v:V('beinpresse richtige ausführung technik')},
      {id:'a2',n:'Rumänisches Kreuzheben, KH', s:3, r:'8–10', rpe:'7–8', note:'Nur so tief, wie der untere Rücken gerade bleibt.', v:V('rumänisches kreuzheben kurzhantel technik')},
      {id:'a3',n:'Latzug, neutraler Griff', s:3, r:'10–12', rpe:'7', v:V('latzug neutraler griff technik')},
      {id:'a4',n:'Brustgestütztes Rudern', s:3, r:'10–12', rpe:'7', v:V('brustgestütztes rudern maschine technik')},
      {id:'a5',n:'Beinbeuger liegend', s:2, r:'12', rpe:'7', note:'Nur 2 Sätze – Laufen belastet die Hamstrings ohnehin.', v:V('beinbeuger liegend ausführung')},
      {id:'a6',n:'Wadenheben, 2 s tiefe Ferse', s:4, r:'12–15', rpe:'8', note:'Deine wichtigste Prophylaxe bei 24 km/Woche.', v:V('wadenheben technik voller bewegungsumfang')},
      {id:'a7',n:'Dead Bug', s:3, r:'8 je Seite', rpe:'7', v:V('dead bug übung anleitung deutsch')},
    ]},
  L1:{name:'Lauf 1 – Regeneration', type:'run', short:'6', sub:'6 km locker, Zone 2',
    km:6, hint:'Wenn du dich am Ende nicht besser fühlst als am Anfang, war es zu schnell. Bei schweren Beinen: 4 km oder zügig gehen.'},
  B:{name:'Einheit B – Druck & Rumpf', type:'gym', short:'B', sub:'Mittlere Intensität',
    ex:[
      {id:'b1',n:'Brustpresse, neutraler Griff', s:4, r:'10–12', rpe:'7', note:'Ellbogen nicht hinter die Rumpfebene.', v:V('brustpresse maschine technik neutraler griff')},
      {id:'b2',n:'Goblet Squat, tief, 2 s halten', s:4, r:'8–10', rpe:'7', note:'Wichtigste Mobility-Übung mit Gewicht.', v:V('goblet squat technik tief anleitung')},
      {id:'b3',n:'Kabelrudern eng', s:4, r:'10–12', rpe:'7', note:'Ellbogen am Körper.', v:V('kabelrudern eng sitzend technik')},
      {id:'b4',n:'Beinstrecker', s:3, r:'12–15', rpe:'8', v:V('beinstrecker maschine ausführung')},
      {id:'b5',n:'Trizeps Pushdown', s:3, r:'12–15', rpe:'7', v:V('trizeps pushdown seil technik')},
      {id:'b6',n:'Hammercurl', s:3, r:'10–12', rpe:'7', v:V('hammercurls technik anleitung')},

function lsGet(k,d){ try{ return localStorage.getItem(k)??d; }catch(e){ return d; } }

function profiles(){

function load(){
  if(!canStore) return mem;
  try{
    let raw=localStorage.getItem(storeKey());

    if(!raw){ const old=localStorage.getItem('tlog');
      if(old){ localStorage.setItem(storeKey(),old); localStorage.removeItem('tlog'); raw=old; } }
    return JSON.parse(raw||'{}');
  }catch(e){ return {}; }
}
function save(d){
  mem = d;
  if(canStore){

}

  Object.values(DB.logs||{}).forEach(l=>{
    if(!l.sets||!order[l.key]) return;
    const ns={};
    Object.keys(l.sets).forEach(k=>{
      const [i,s]=k.split('_');
      const id = /^\d+$/.test(i) ? (order[l.key][+i]||i) : i;
      ns[id+'_'+s]=l.sets[k];
    });

  });

}

// 1) Browser bitten, die Daten dauerhaft zu behalten (schützt vor automatischem Aufräumen)
(async()=>{ try{

    if(!already) await navigator.storage.persist();
  }
}catch(e){} })();

// 2) IndexedDB für den Dateizeiger
function idb(mode,fn){ return new Promise((res,rej)=>{
  let r; try{ r=indexedDB.open('tlogfs',1); }catch(e){ return rej(e); }
  r.onupgradeneeded=()=>{ try{ r.result.createObjectStore('kv'); }catch(e){} };
  r.onsuccess=()=>{ try{ const db=r.result, t=db.transaction('kv',mode), s=t.objectStore('kv');
    const q=fn(s); t.oncomplete=()=>res(q?q.result:null); t.onerror=()=>rej(t.error);
  }catch(e){ rej(e); } };
  r.onerror=()=>rej(r.error);
});}

const fsSupported = typeof window.showSaveFilePicker==='function';

async function restoreHandle(){
  if(!fsSupported) return null;
  try{
    const h=await idb('readonly',s=>s.get('handle::'+PROFILE));
    if(!h) return null;
    let p=await h.queryPermission({mode:'readwrite'});
    if(p!=='granted') return h; // Berechtigung erst bei Nutzeraktion anfragen
    fsHandle=h; return h;
  }catch(e){ return null; }
}
async function linkFile(){
  if(!fsSupported){ toast('Dein Browser kann das nicht – nutze Backup-Code'); return; }
  try{
    const h=await window.showSaveFilePicker({suggestedName:'myfitty.json',
      types:[{description:'myfitty',accept:{'application/json':['.json']}}]});
    await idb('readwrite',s=>s.put(h,'handle::'+PROFILE));
    fsHandle=h; await writeFs(true); render();
    toast('Verknüpft – wird ab jetzt automatisch gesichert');
  }catch(e){ if(e.name!=='AbortError') toast('Verknüpfen fehlgeschlagen'); }
}
async function unlinkFile(){
  fsHandle=null; try{ await idb('readwrite',s=>s.delete('handle::'+PROFILE)); }catch(e){}
  render(); toast('Verknüpfung gelöst');
}
async function writeFs(force){
  if(!fsHandle) return false;
  try{
    let p=await fsHandle.queryPermission({mode:'readwrite'});
    if(p!=='granted'){
      if(!force) return false;
      p=await fsHandle.requestPermission({mode:'readwrite'});
      if(p!=='granted') return false;
    }
    const w=await fsHandle.createWritable();
    await w.write(JSON.stringify(DB,null,2)); await w.close();
    DB.meta.lastBackup=todayKey();
    if(canStore){ try{ localStorage.setItem(storeKey(),JSON.stringify(DB)); }catch(e){} }
    const el=document.getElementById('fsState'); if(el) el.textContent='zuletzt gesichert: gerade eben';
    return true;
  }catch(e){ return false; }
}
function scheduleFs(){ if(!fsHandle) return; clearTimeout(fsTimer); fsTimer=setTimeout(()=>writeFs(false),1500); }

async function loadFromFile(){

/* Backup-Code (überall nutzbar) */
function toCode(){ return btoa(unescape(encodeURIComponent(JSON.stringify(DB)))); }
function fromCode(c){
  try{ const d=JSON.parse(decodeURIComponent(escape(atob(c.trim()))));
    if(!d.logs) throw 0;
    DB=Object.assign({logs:{},daily:{},start:todayKey(),meta:{}},d); if(!DB.meta)DB.meta={};
    applyPlan(); save(DB); go('home'); toast('Wiederhergestellt ✓');
  }catch(e){ toast('Code ungültig'); }
}
function copyCode(){
  const c=toCode();
  const done=()=>{ DB.meta.lastBackup=todayKey(); save(DB); toast('Code kopiert – in Notizen einfügen'); };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(c).then(done,()=>fallbackCopy(c,done));
  } else fallbackCopy(c,done);
}
function fallbackCopy(c,cb){
  const t=document.createElement('textarea'); t.value=c; t.style.position='fixed'; t.style.opacity='0';
  document.body.appendChild(t); t.select();
  try{ document.execCommand('copy'); cb(); }catch(e){ toast('Kopieren nicht möglich'); }
  document.body.removeChild(t);
}
async function shareBackup(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const file=new File([blob],'myfitty-'+todayKey()+'.json',{type:'application/json'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file],title:'myfitty-Backup'});
      DB.meta.lastBackup=todayKey(); save(DB); return; }catch(e){ if(e.name==='AbortError') return; }
  }
  exportData();
}
function daysSinceBackup(){
  if(!DB.meta.lastBackup) return 999;
  return Math.floor((new Date(todayKey()+'T00:00:00') - new Date(DB.meta.lastBackup+'T00:00:00'))/864e5);
}
function backupOverdue(){
  const n=Object.values(DB.logs).filter(l=>l.done).length;
  if(n===0) return false;
  if(fsHandle) return false;
  return daysSinceBackup()>=7;
}

/* now() respektiert den Testmodus (simuliertes Datum) */
function now(){
  const sim = DB && DB.meta && DB.meta.sim;
  return sim ? new Date(sim+'T12:00:00') : new Date();
}
function simOn(){ return !!(DB && DB.meta && DB.meta.sim); }
function todayKey(d){ const x=d||now(); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); }
function dayIdx(d){ const x=(d||now()).getDay(); return x===0?6:x-1; }
function weekNum(){
  const s=new Date(DB.start+'T00:00:00'), n=now();
  return Math.max(1,Math.floor((n-s)/(7*864e5))+1);
}
function fmtDate(k){ const [y,m,d]=k.split('-'); return d+'.'+m+'.'; }

function lastSame(key,beforeDate){
  const ids=Object.keys(DB.logs).filter(id=>DB.logs[id].key===key && DB.logs[id].date<beforeDate && DB.logs[id].done);

];

/* Gemeinsame Zerlegung. Liefert immer eine exakte Summe und
   eine Kleineinheit (Meerschweinchen bzw. Dackel) zwischen 3 und 33. */
function packLadder(T, ladder){
  if(T<=33) return {items:[], small:Math.max(3,T), total:T};

  // Leiter über die Größenordnungen wählen, damit die Stückzahlen klein bleiben
  const start=ladder.findIndex(i=>i.w<=T);
  const pal=[];
  for(let i=start;i<ladder.length && pal.length<4;i+=2) pal.push(ladder[i]);
  const fine=ladder[ladder.length-1];
  if(!pal.some(i=>i.w===fine.w)) pal.push(fine);
  pal.sort((a,b)=>b.w-a.w);

  // Grundbudget der Kleineinheit: immer ≥3, variabel damit die Zahl nicht immer gleich ist
  let small = 3 + (T % 19);                 // 3–21
  let rest  = T - small;
  // Den größten Posten nicht wegbudgetieren (sonst wird aus 1 Marathon plötzlich 15 Brücken)
  if(pal.length && T-pal[0].w >= 3 && rest < pal[0].w){ small = T - pal[0].w; rest = pal[0].w; }

  const items=[];
  for(const it of pal){
    const c=Math.floor(rest/it.w);
    if(c<1) continue;
    items.push({e:it.e,s:it.s,p:it.p,w:it.w,c});
    rest -= c*it.w;
  }
  small += rest;                            // exakt; Rest < kleinste Stufe
  items.sort((a,b)=>b.w-a.w);
  return {items,small,total:T};
}

// Meerschweinchen immer 3–33
function gainsBreak(kg){
  const r=packLadder(Math.round(kg), GITEMS.map(i=>({...i,w:i.kg})));
  return {items:r.items.map(i=>({...i,kg:i.w})), pigs:r.small, total:r.total};
}

function dquip(km,min){
  const pace = min ? min/km : 0;
  if(km>=42) return 'Das war ein Marathon. Der Schulterblock danach ist heute optional. Nein, war ein Scherz.';
  if(km>=20) return 'Respekt. Bei der Länge lohnt sich der Blick auf die Armhaltung doppelt.';
  if(km>=12) return 'Lange Einheit. Morgen die Beine locker halten, nicht komplett stillsitzen.';
  if(km>=9)  return 'Solide Grundlage. Genau die Läufe bauen die Ausdauer, die du behalten willst.';
  if(km>=7)  return 'Gute Runde. Zone 2 ist unspektakulär und genau deshalb wirksam.';
  if(km>=5)  return 'Kurz und locker – wenn du dich besser fühlst als vorher, war das Tempo richtig.';
  if(km>=2)  return 'Kleine Runde, zählt trotzdem. Regeneration ist kein Nichtstun.';
  return 'Jeder Meter zählt. Die Dackel auch.';
}

/* --- Dashboard-Helfer --- */
function mondayOf(d){ const x=new Date(d.getTime?d.getTime():d); const i=x.getDay()===0?6:x.getDay()-1; x.setDate(x.getDate()-i); x.setHours(0,0,0,0); return x; }
function tonnage(l){
  if(PLAN[l.key].type!=='gym') return 0;
  let t=0; Object.values(l.sets).forEach(s=>{ if(s.d&&s.w&&s.r) t+=s.w*s.r; });
  return t;
}
function weeks(n){ // letzte n Wochen, älteste zuerst
  const out=[], m0=mondayOf(now());
  for(let i=n-1;i>=0;i--){
    const m=new Date(m0); m.setDate(m0.getDate()-i*7);
    const keys=[]; for(let d=0;d<7;d++){ const x=new Date(m); x.setDate(m.getDate()+d); keys.push(todayKey(x)); }
    const logs=Object.values(DB.logs).filter(l=>l.done&&keys.includes(l.date));
    out.push({
      monday:m, keys, logs,
      label:String(m.getDate()).padStart(2,'0')+'.'+String(m.getMonth()+1).padStart(2,'0'),
      gym:logs.filter(l=>PLAN[l.key].type==='gym').length,
      runs:logs.filter(l=>PLAN[l.key].type==='run').length,
      km:logs.filter(l=>PLAN[l.key].type==='run').reduce((a,l)=>a+(parseFloat(l.km)||PLAN[l.key].km||0),0),
      ton:logs.reduce((a,l)=>a+tonnage(l),0),
      mob:keys.filter(k=>DB.daily[k]).length,
      pains:logs.filter(l=>l.pain!=null).map(l=>l.pain),
    });
  }
  return out;
}
function bars(vals,opt){
  const o=opt||{}, max=Math.max(1,...vals.map(v=>v.v));
  let h=`<div class="chart">`;
  vals.forEach(v=>{ const cls=o.cls?o.cls(v):'';
    h+=`<div class="b ${cls}" style="height:${v.v>0?Math.max(4,v.v/max*100):3}%" title="${v.t||''}"></div>`; });
  h+=`</div><div class="xax">`;
  vals.forEach(v=>{ h+=`<span>${v.l}</span>`; });
  h+=`</div>`;
  return h;
}

function vStats(){
  const all=Object.values(DB.logs).filter(l=>l.done);

  h+=`<h2>Konsistenz</h2><div class="card">
    <div class="hm"><div></div>`;
  ['M','D','M','D','F','S','S'].forEach(d=>h+=`<div class="hd">${d}</div>`);
  const tk=todayKey();
  W.forEach(w=>{
    h+=`<div class="lbl">${w.label}</div>`;
    w.keys.forEach((k,i)=>{
      const l=DB.logs[k+'|'+WEEK[i][1]];

    <span><i style="background:var(--line)"></i>nichts</span></div></div>`;

  if(kmTot>0){

    h+=bars(W.map(w=>({v:w.km,l:w.label.slice(0,5),t:w.label+': '+w.km.toFixed(1)+' km'})),{cls:()=>'run'});

  }

  /* Volumen */
  if(tonTot>0){
    h+=`<h2>Trainingsvolumen</h2><div class="card">

  }

  /* Schulter */
  const painLogs=all.filter(l=>l.pain!=null).sort((a,b)=>a.date.localeCompare(b.date));
  h+=`<h2>Schulter – dein Hauptziel</h2><div class="card" style="border-color:var(--accent)">`;

    h+=`<div class="muted">Trage nach jeder Einheit den Schulterschmerz ein. Ab zwei Einträgen entsteht hier die Kurve, die zeigt, ob der Plan wirkt.</div>`;
  } else {
    const last=painLogs.slice(-14);
    const n=Math.min(4,Math.floor(painLogs.length/2));
    const first4=painLogs.slice(0,n), last4=painLogs.slice(-n);
    const a1=first4.reduce((a,l)=>a+l.pain,0)/n, a2=last4.reduce((a,l)=>a+l.pain,0)/n;

      <div><div class="big">${a2.toFixed(1)}</div><div class="muted">Ø letzte ${n}</div></div>

    h+=bars(last.map(l=>({v:Math.max(l.pain,0),l:fmtDate(l.date).slice(0,5),t:fmtDate(l.date)+': '+l.pain+'/10'})),
      {cls:v=>v.v>=4?'hi':'pain'});
    let txt;
    if(d<=-1) txt='<strong>Die Kurve fällt deutlich.</strong> Der Plan wirkt – Belastungssteuerung und Reha-Block greifen. Weitermachen, Bewegungsumfang erst erweitern, wenn zwei Wochen unter 2/10 liegen.';
    else if(d<-.3) txt='<strong>Leicht rückläufig.</strong> Die Richtung stimmt, aber langsam. Prüfe im Notizfeld, welche Übung immer wieder auftaucht.';
    else if(d<.4) txt='<strong>Unverändert.</strong> Nach 4–6 Wochen ohne Besserung ist eine ärztliche Untersuchung dran – Ultraschall oder MRT. Weiter am Trainingsplan zu schrauben bringt dann nichts mehr.';
    else txt='<strong>Die Werte steigen.</strong> Reduziere das Oberkörpervolumen, streiche einen Lauf und geh zum Arzt. Bei sechs Belastungstagen kann auch schlichte Überlastung die Ursache sein.';
    h+=`<div class="verdict">${txt}</div>`;
    const bad=painLogs.filter(l=>l.pain>=4).length;
    if(bad) h+=`<div class="note">${bad} Einheit${bad>1?'en':''} mit 4/10 oder höher – dort war der Reiz zu groß.</div>`;
  }
  // Reha-Adhärenz
  const gymL=all.filter(l=>PLAN[l.key].type==='gym');
  const shFull=gymL.filter(l=>SHOULDER.every((x,i)=>l.sh['s'+i])).length;
  const bandRuns=runs.filter(l=>l.sh&&l.sh.band).length;
  h+=`<div class="kpi" style="margin-top:12px">
    <div class="stat"><div class="v">${gymL.length?Math.round(shFull/gymL.length*100):0}%</div><div class="l">Reha-Block komplett</div></div>
    <div class="stat"><div class="v">${runs.length?Math.round(bandRuns/runs.length*100):0}%</div><div class="l">Band nach dem Lauf</div></div></div>
  <div class="note">Beide Zahlen sind der direkteste Hebel auf dein Hauptziel. Rotatorenmanschette reagiert auf Häufigkeit stärker als auf Intensität.</div></div>`;

  /* Bestwerte */
  const gymKeys=Object.keys(PLAN).filter(k=>PLAN[k].type==='gym'&&PLAN[k].ex);
  const prs=[];
  gymKeys.forEach(k=>PLAN[k].ex.forEach((e,i)=>{
    const X=e.id||('x'+i);
    let best=0,r='',dt='';
    Object.values(DB.logs).filter(l=>l.key===k&&l.done).forEach(l=>{
      Object.keys(l.sets).forEach(sk=>{ if(sk.slice(0,sk.lastIndexOf('_'))===X){ const s=l.sets[sk];
        const w=parseFloat(s.w)||0; if(s.d&&w>best){best=w;r=s.r||'';dt=l.date;} }});
    });
    if(best>0) prs.push({n:e.n,w:best,r,dt});
  }));
  if(prs.length){
    h+=`<h2>Bestwerte</h2><div class="card">`;
    prs.sort((a,b)=>b.w-a.w).forEach(p=>{
      h+=`<div class="trow"><span class="nm">${p.n}</span>
        <span class="muted" style="font-size:.75rem">${fmtDate(p.dt)}</span>
        <span class="vl">${p.w} kg${p.r?' × '+p.r:''}</span></div>`;
    });
    h+=`</div>`;

  /* Übungsverlauf */
  h+=`<h2>Gewichtsverlauf einer Übung</h2><div class="card">

  h+=`<h2>Wochenbilanz</h2><div class="card">
    <div class="trow" style="font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em">
      <span class="nm">Woche ab</span><span style="width:34px;text-align:center">💪</span>
      <span style="width:34px;text-align:center">🏃</span><span style="width:52px;text-align:right">km</span>
      <span style="width:46px;text-align:right">Vol.</span></div>`;
  W.slice().reverse().forEach(w=>{
    if(!w.logs.length && !w.mob) return;
    h+=`<div class="trow"><span class="nm">${w.label}</span>
      <span style="width:34px;text-align:center;${w.gym>=3?'color:var(--accent);font-weight:600':''}">${w.gym}</span>

      <span style="width:52px;text-align:right">${w.km?w.km.toFixed(1):'–'}</span>
      <span style="width:46px;text-align:right">${w.ton?(w.ton/1000).toFixed(1)+'t':'–'}</span></div>`;
  });
  if(!W.some(w=>w.logs.length)) h+=`<div class="muted">Noch keine abgeschlossenen Einheiten.</div>`;
  h+=`</div>`;

  /* Letzte Einheiten */
  h+=`<h2>Letzte Einheiten</h2><div class="card">`;
  const sorted=all.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,12);
  if(!sorted.length) h+=`<div class="muted">Noch nichts abgeschlossen.</div>`;
  sorted.forEach(l=>{
    const p=PLAN[l.key];
    const t=tonnage(l);
    let det = p.type==='run' ? `${l.km||p.km} km${l.min?' · '+l.min+' Min':''}${paceShort(l)}`
      : `${Object.values(l.sets).filter(s=>s.d).length} Sätze${t?' · '+(t/1000).toFixed(1)+' t':''}`;
    h+=`<div class="hist"><div style="width:30px;height:30px;border-radius:8px;font-size:.78rem;font-weight:700;display:flex;align-items:center;justify-content:center;color:#fff;background:${p.type==='run'?'var(--run)':'var(--accent)'};flex:none">${p.short}</div>
      <div class="grow"><div style="font-size:.88rem;font-weight:600">${p.name}</div>
      <div class="muted" style="font-size:.78rem">${fmtDate(l.date)} · ${det}</div></div>
      ${t?`<button class="btn sec small" style="padding:5px 9px" onclick="showGains(${Math.round(t)},'${fmtDate(l.date)}')">🐹</button>`:''}
      ${p.type==='run'?`<button class="btn sec small" style="padding:5px 9px" onclick="showDist(${parseFloat(l.km)||p.km},${parseFloat(l.min)||0},'${fmtDate(l.date)}')">🐕</button>`:''}
      ${l.pain!=null?`<span class="pill" style="background:${l.pain>=4?'var(--warn)':'var(--line)'};color:${l.pain>=4?'#fff':'var(--muted)'}">${l.pain}/10</span>`:''}
      </div>`;
  });
  h+=`</div>`;
  return h;
}
function paceShort(l){
  const km=parseFloat(l.km), min=parseFloat(l.min);
  if(!km||!min) return '';
  const p=min/km, m=Math.floor(p), s=Math.round((p-m)*60);
  return ` · ${m}:${String(s).padStart(2,'0')}/km`;
}

function showEx(val){
  const out=document.getElementById('exOut');
  if(!val){ out.innerHTML=''; return; }
  const [k,X]=val.split('|');
  const logs=Object.values(DB.logs).filter(l=>l.key===k&&l.done).sort((a,b)=>a.date.localeCompare(b.date));
  const pts=logs.map(l=>{
    let best=0,r=0; Object.keys(l.sets).forEach(sk=>{ if(sk.slice(0,sk.lastIndexOf('_'))===X){ const s=l.sets[sk]; const w=parseFloat(s.w)||0; if(w>best){best=w;r=s.r||'';} }});
    return {d:l.date,w:best,r};
  }).filter(p=>p.w>0);
  if(!pts.length){ out.innerHTML='<div class="muted">Noch keine Daten für diese Übung.</div>'; return; }
  const max=Math.max(...pts.map(p=>p.w));
  const first=pts[0].w, last=pts[pts.length-1].w;
  const diff=last-first;
  let h=`<div class="row"><div><div class="big">${last} kg</div><div class="muted">aktuell${pts.length>1?` · ${diff>=0?'+':''}${diff.toFixed(1)} kg seit Start`:''}</div></div></div><div class="hbar">`;
  pts.slice(-16).forEach(p=>{ h+=`<div style="height:${Math.max(6,p.w/max*100)}%" title="${fmtDate(p.d)}: ${p.w} kg × ${p.r}"></div>`;});
  h+=`</div><div class="muted" style="font-size:.75rem">${pts.length} Einträge · Bestwert ${max} kg</div>`;
  out.innerHTML=h;
}

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function vidTerm(url){ if(!url) return '';
  try{ return decodeURIComponent(url.split('search_query=')[1]||'').replace(/\+/g,' '); }catch(e){ return ''; } }

function editSession(k){ editKey=k; view='editSession'; render(); window.scrollTo(0,0); }
function setDay(i,k){ WEEK[i][1]=k; planEdited(); render(); }
function setS(f,v){ PLAN[editKey][f]=v; planEdited(); }
function bumpEx(i,d){
  const e=PLAN[editKey].ex[i];
  e.s = Math.max(1, Math.min(12, (parseInt(e.s)||1) + d));
  planEdited(); render();
}
function setEx(i,f,v){ PLAN[editKey].ex[i][f]=v; planEdited();
  if(f==='ic') render(); }
function toggleMg(i,k){
  const e=PLAN[editKey].ex[i];
  const cur=mgOf(e).slice();
  const p=cur.indexOf(k);
  if(p>=0) cur.splice(p,1); else cur.push(k);
  e.mg=cur; planEdited(); render();
}
function setVid(i,term){ PLAN[editKey].ex[i].v = term.trim()? V(term.trim()) : ''; planEdited(); }
function moveEx(i,d){ const a=PLAN[editKey].ex, j=i+d;
  if(j<0||j>=a.length) return; [a[i],a[j]]=[a[j],a[i]]; planEdited(); render(); }
function delEx(i){ const e=PLAN[editKey].ex[i];
  if(!confirm('„'+e.n+'" wirklich entfernen?')) return;
  PLAN[editKey].ex.splice(i,1); planEdited(); render(); }
function addEx(){ PLAN[editKey].ex.push({id:newId(),n:'Neue Übung',s:3,r:'10',rpe:'7',note:'',v:''});
  planEdited(); render(); setTimeout(()=>window.scrollTo(0,document.body.scrollHeight),60); }
function addSession(type){
  const k=newKey();
  PLAN[k]= type==='gym'
    ? {name:'Neue Krafteinheit',type:'gym',short:'N',sub:'',ex:[{id:newId(),n:'Neue Übung',s:3,r:'10',rpe:'7',note:'',v:''}]}
    : {name:'Neuer Lauf',type:'run',short:'km',sub:'',km:5,hint:''};
  planEdited(); editSession(k);
}
function delSession(){
  const p=PLAN[editKey];
  if(editKey==='R'){ toast('Der Ruhetag wird gebraucht'); return; }
  if(!confirm('„'+p.name+'" wirklich löschen?')) return;
  WEEK.forEach(w=>{ if(w[1]===editKey) w[1]='R'; });
  delete PLAN[editKey];
  DB.deleted = (DB.deleted||[]).concat([editKey]);
  planEdited(); go('edit');
}
function resetPlan(){
  if(!confirm('Plan auf den Standard zurücksetzen? Dein Verlauf bleibt erhalten.')) return;
  delete DB.plan; delete DB.week; delete DB.deleted; save(DB); applyPlan(); go('edit'); toast('Plan zurückgesetzt');
}

function setSim(v){
  if(v) DB.meta.sim=v; else delete DB.meta.sim;
  save(DB); render();
  toast(v?'Testdatum gesetzt':'Testmodus aus');
}
function simDay(i){
  const base=now(); const cur=dayIdx();
  const d=new Date(base); d.setDate(base.getDate()+(i-cur));
  setSim(todayKey(d));
}
function makeDemo(){
  const base=now();
  let n=0;
  for(let back=20;back>=1;back--){
    const day=new Date(base); day.setDate(base.getDate()-back);
    const i=day.getDay()===0?6:day.getDay()-1;
    const k=WEEK[i][1], p=PLAN[k], dk=todayKey(day);
    if(DB.logs[dk+'|'+k]) continue;
    DB.daily[dk]=1;
    if(p.type==='rest') continue;
    const L=getLog(dk,k);
    L.done=true; L.demo=true;
    L.pain=Math.max(0,Math.round(4 - (20-back)/7));
    if(p.type==='run'){
      L.km=p.km; L.min=Math.round(p.km*5.6);
      L.sh={band:back%3!==0};
    } else {
      (p.ex||[]).forEach((e,ei)=>{
        const bw=[60,50,45,40,35,30,0][ei%7] + Math.round((20-back)/7)*2.5;
        for(let s=0;s<e.s;s++) L.sets[(e.id||('x'+ei))+'_'+s]={w:bw||null,r:10,d:true};
      });
      SHOULDER.forEach((x,si)=>L.sh['s'+si]=true);
    }
    n++;
  }
  save(DB); render(); toast(n+' Demo-Einheiten erzeugt');
}
function clearDemo(){
  const ids=Object.keys(DB.logs).filter(id=>DB.logs[id].demo);
  if(!ids.length){ toast('Keine Demodaten vorhanden'); return; }
  if(!confirm(ids.length+' Demo-Einträge löschen? Echte Einträge bleiben.')) return;
  ids.forEach(id=>delete DB.logs[id]);
  save(DB); render(); toast('Demodaten entfernt');
}

  }

  h+=`<div class="card"><strong style="font-size:.95rem">2 · Backup-Code (funktioniert überall)</strong>
    <div class="note">Kopiert deinen gesamten Verlauf als Textblock. Füg ihn in deine Notizen-App, eine Mail an dich selbst oder einen Passwortmanager ein. Zum Wiederherstellen einfach zurückkopieren – auch auf einem anderen Gerät.</div>
    <div style="margin-top:10px"><button class="btn ${nLogs&&dsb>=7?'':'sec'}" onclick="copyCode()">Backup-Code kopieren</button></div>
    <div style="margin-top:8px"><button class="btn sec" onclick="toggleRestore()">Aus Code wiederherstellen</button></div>
    <div id="restoreBox" style="display:none;margin-top:10px">
      <textarea id="codeIn" placeholder="Backup-Code hier einfügen…" style="min-height:90px;font-size:.75rem"></textarea>
      <div style="margin-top:8px"><button class="btn" onclick="fromCode(document.getElementById('codeIn').value)">Wiederherstellen</button></div>
      <div class="note">Achtung: überschreibt den aktuellen Stand.</div>
    </div></div>`;

  h+=`<div class="card"><strong style="font-size:.95rem">3 · Datei-Export</strong>
    <div class="note">Klassisch als JSON-Datei – zum Ablegen in der Cloud oder Weitergeben.</div>
    <div style="margin-top:10px"><button class="btn sec" onclick="shareBackup()">Backup teilen / speichern</button></div>
    <div style="margin-top:8px"><button class="btn sec" onclick="document.getElementById('imp').click()">Datei importieren</button>
      <input id="imp" type="file" accept=".json,application/json" style="display:none" onchange="importData(this)"></div>
    <div style="margin-top:8px"><button class="btn sec" style="color:var(--warn)" onclick="resetAll()">Alles zurücksetzen</button></div>
  </div>`;

  h+=`<details><summary>Neue App-Version übernehmen</summary>
    <div class="note">Wenn du eine überarbeitete Version der App bekommst, geht dein Verlauf nicht verloren – du musst ihn nur mitnehmen:</div>
    <ul>
      <li><strong>1.</strong> In der alten Version: „Backup-Code kopieren" (oder mit verknüpfter Datei: nichts tun, sie ist schon aktuell).</li>
      <li><strong>2.</strong> Neue Datei öffnen.</li>
      <li><strong>3.</strong> Dort „Aus Code wiederherstellen" bzw. „Aus Datei laden &amp; verknüpfen".</li>
    </ul>
    <div class="note">Wichtig: Ein selbst bearbeiteter Plan steckt mit im Backup. Nach dem Wiederherstellen gilt also weiter dein Plan, nicht der aus der neuen Datei. Willst du den neuen übernehmen, im Editor „Plan auf Standard zurücksetzen" drücken – der Verlauf bleibt dabei erhalten.</div></details>`;
  h+=`<details><summary>Warum sind die Daten sonst weg?</summary>
    <div class="note">Eine reine Browser-App speichert im Browserspeicher dieser Seite. Der verschwindet, wenn du „Website-Daten löschen" nutzt, den privaten Modus verwendest, oder – auf dem iPhone – wenn du die Seite mehrere Wochen nicht öffnest und Safari sie automatisch aufräumt.</div>
    <ul>
      <li><strong>Am wirksamsten:</strong> Datei verknüpfen (Punkt 1) – dann liegen die Daten außerhalb des Browsers.</li>
      <li><strong>Auf dem iPhone:</strong> „Zum Home-Bildschirm hinzufügen". Installierte Web-Apps werden von Safari nicht automatisch aufgeräumt. Zusätzlich alle paar Wochen den Backup-Code in die Notizen legen.</li>
      <li>Die App hat den Browser um dauerhaften Speicher gebeten – das schützt vor automatischem Aufräumen, aber nicht davor, dass du selbst die Daten löschst.</li>
      <li>Backup-Codes sind winzig, ein Jahr Training passt problemlos in eine Notiz.</li>
    </ul></details>`;
  h+=`<div class="card"><div class="note" style="margin-top:0"><strong>Tipp:</strong> Auf dem Handy „Zum Home-Bildschirm hinzufügen" – dann startet die App im Vollbild und ihre Daten sind deutlich besser geschützt.</div></div>`;
  h+=`<div class="muted" style="text-align:center;font-size:.75rem;margin-top:22px">Version ${APP_BUILD}</div>`;
  h+=`<div class="muted" style="text-align:center;font-size:.75rem;margin-top:6px">Kein medizinischer Rat. Bei zunehmenden Schmerzen, Nachtschmerz oder Kraftverlust ärztlich abklären lassen.</div>`;
  return h;
}

/* ============ ACTIONS ============ */
function setVal(x,s,f,v){
  const L=getLog(activeDate,activeKey), k=x+'_'+s;
  if(!L.sets[k]) L.sets[k]={};
  L.sets[k][f]= v===''?null:parseFloat(v);
  save(DB);
}
function toggleSet(x,s){
  const L=getLog(activeDate,activeKey), k=x+'_'+s;
  if(!L.sets[k]) L.sets[k]={};
  L.sets[k].d=!L.sets[k].d;
  // Auto-fill: leeres Gewicht mit letztem Satz vorbelegen
  if(L.sets[k].d && L.sets[k].w==null && s>0 && L.sets[x+'_'+(s-1)]){
    L.sets[k].w=L.sets[x+'_'+(s-1)].w; L.sets[k].r=L.sets[x+'_'+(s-1)].r;
  }
  save(DB);
  if(L.sets[k].d) startTimer(90);
  render();
}
function toggleSh(i){ const L=getLog(activeDate,activeKey); L.sh['s'+i]=!L.sh['s'+i]; save(DB); render(); }
function toggleShBand(){ const L=getLog(activeDate,activeKey); L.sh.band=!L.sh.band; save(DB); render(); }
function toggleShStretch(){ const L=getLog(activeDate,activeKey); L.sh.stretch=!L.sh.stretch; save(DB); render(); }
function setField(f,v){ const L=getLog(activeDate,activeKey); L[f]= v===''?null:v; save(DB);
  if(f==='km'||f==='min'){ const o=document.getElementById('paceOut'); if(o) o.textContent=paceTxt(L); } }
function setPain(v){ const L=getLog(activeDate,activeKey); L.pain=parseInt(v); save(DB);
  const e=document.getElementById('pv'); if(e) e.textContent=v; }
function paceTxt(L){
  const km=parseFloat(L.km), min=parseFloat(L.min);
  if(!km||!min) return 'Pace erscheint, sobald beides eingetragen ist';
  const p=min/km, m=Math.floor(p), s=Math.round((p-m)*60);
  return `Pace: ${m}:${String(s).padStart(2,'0')} min/km`;
}
function toggleDaily(){ const d=todayKey(); if(DB.daily[d]) delete DB.daily[d]; else DB.daily[d]=1; save(DB); render(); }
function finish(){
  const L=getLog(activeDate,activeKey);
  L.done=!L.done; save(DB);
  if(L.done){
    stopTimer();
    const t=tonnage(L);
    if(PLAN[activeKey].type==='gym' && t>0){
      gainsAfter=()=>go('home');
      showGains(t);
      return;
    }
    if(PLAN[activeKey].type==='run'){
      const km=parseFloat(L.km)||PLAN[activeKey].km;
      if(km>0){
        gainsAfter=()=>go('home');
        showDist(km, parseFloat(L.min)||0);
        return;
      }
    }
    toast('Einheit gespeichert ✓'); setTimeout(()=>go('home'),700);
  }
  else render();
}
function resetAll(){
  if(!confirm('Wirklich alle Einträge löschen? Das lässt sich nicht rückgängig machen.')) return;
  DB={logs:{},daily:{},start:todayKey(),meta:{}}; save(DB); go('home'); toast('Zurückgesetzt');
}
function exportData(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='myfitty-'+todayKey()+'.json';
  a.click();
  DB.meta.lastBackup=todayKey(); save(DB);
  toast('Exportiert');
}
function toggleRestore(){
  const b=document.getElementById('restoreBox');
  b.style.display = b.style.display==='none' ? 'block' : 'none';
}
function importData(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=e=>{ try{ const d=JSON.parse(e.target.result);
    if(!d.logs) throw 0; DB=Object.assign({logs:{},daily:{},start:todayKey(),meta:{}},d);
    if(!DB.meta) DB.meta={}; applyPlan(); save(DB); go('home'); toast('Importiert ✓');
  }catch(x){ toast('Datei nicht lesbar'); } };
  r.readAsText(f);
}
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.className='toast on';
  setTimeout(()=>t.className='toast',1800); }

/* ============ TIMER ============ */
let tInt=null, tLeft=0;
function startTimer(s){ tLeft=s; document.getElementById('timerbar').className='timerbar on'; tick();
  clearInterval(tInt); tInt=setInterval(()=>{ tLeft--; tick(); if(tLeft<=0){ stopTimer(); beep(); } },1000); }
function tick(){ const m=Math.floor(tLeft/60), s=tLeft%60;
  document.getElementById('tmDisp').textContent=m+':'+String(s).padStart(2,'0'); }
function addTime(s){ tLeft+=s; tick(); }
function stopTimer(){ clearInterval(tInt); tInt=null; document.getElementById('timerbar').className='timerbar'; }
function beep(){ try{ const c=new (window.AudioContext||window.webkitAudioContext)();
  [0,180].forEach(d=>{ const o=c.createOscillator(), g=c.createGain();
    o.connect(g); g.connect(c.destination); o.frequency.value=880;
    g.gain.setValueAtTime(.001,c.currentTime+d/1000);
    g.gain.exponentialRampToValueAtTime(.25,c.currentTime+d/1000+.01);
    g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d/1000+.15);
    o.start(c.currentTime+d/1000); o.stop(c.currentTime+d/1000+.16); });
  }catch(e){} if(navigator.vibrate) navigator.vibrate([120,80,120]); }

render();
restoreHandle().then(h=>{ if(h) render(); });

/* Service Worker – nur über http(s); als lokale Datei nicht möglich */
let waitingSW=null, reloading=false;
function applyUpdate(){
  if(!waitingSW){ location.reload(); return; }
  waitingSW.postMessage({type:'SKIP_WAITING'});
}
function showUpdate(w){ waitingSW=w; document.getElementById('upd').className='on'; }

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(reloading) return; reloading=true; location.reload();
  });
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      if(reg.waiting && navigator.serviceWorker.controller) showUpdate(reg.waiting);
      reg.addEventListener('updatefound',()=>{
        const w=reg.installing; if(!w) return;
        w.addEventListener('statechange',()=>{
          if(w.state==='installed' && navigator.serviceWorker.controller) showUpdate(w);
        });
      });
      setInterval(()=>reg.update().catch(()=>{}), 60*60*1000);
      document.addEventListener('visibilitychange',()=>{
        if(!document.hidden) reg.update().catch(()=>{});
      });
    }).catch(()=>{});
  });
}

window.addEventListener('beforeunload',()=>{ if(fsHandle){ clearTimeout(fsTimer); writeFs(false); } });
</script>
